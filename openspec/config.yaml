schema: spec-driven

context: |
  Project: acmers - Minimal-dependency Rust ACME client CLI
  Tech stack: Rust (synchronous), ureq 3 (blocking HTTP), serde_json, rcgen 0.14, ring 0.17
  Constraints:
    - No async runtime
    - No system tool calls for crypto/HTTP/DNS (no curl, openssl, dig)
    - User-configured deployment/reload hooks are the only intentional subprocesses
    - All providers must implement DnsProvider trait
    - Match Debian ureq feature flags for packaging compatibility
    - TXT records must always be cleaned up, even on errors
  Domain: ACME certificate lifecycle, DNS-01 validation, and 200+ DNS providers
  Current state: acmers 0.4.0, 201 providers (196 implemented, 5 stubs), CA presets with EAB registration, 135 tests passing, zero warnings
  Layout: ~/.acmers for users, /var/lib/acmers for root, /etc/acmers/env for unattended credentials
  Packaging: debhelper/dpkg-buildpackage, systemd acmers.timer + acmers.service, /etc/cron.d/acmers fallback
  Docs: README, docs/MIGRATION.md, docs/PROVIDERS.md, debian/acmers.1

rules:
  proposal:
    - Keep proposals focused on specific provider or feature changes
    - Include API endpoint references when modifying providers
    - Document authentication method changes
  tasks:
    - Provider fixes should include test updates
    - Always verify with cargo build and cargo test
  specs:
    - Document API endpoints, auth methods, and env vars for each provider
    - Include example API request/response when relevant
